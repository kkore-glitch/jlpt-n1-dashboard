<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f4" />
    <meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="N1錯題" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>JLPT N1 錯題分析</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <link rel="stylesheet" href="./styles.css?v=14" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="kicker">JLPT N1</p>
        <h1>錯題儀表板</h1>
      </div>
      <div class="header-actions">
        <span id="syncStatus" class="sync-status">尚未同步</span>
        <button id="reloadBtn" class="icon-button" type="button" aria-label="重新整理資料" title="重新整理資料">
          <span aria-hidden="true">↻</span>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <details id="settingsPanel" class="settings-panel">
        <summary>資料來源與寫入設定</summary>
        <div class="settings-grid">
          <div class="field wide">
            <label for="sheetSource">Google Sheet 連結</label>
            <input id="sheetSource" type="url" placeholder="貼上你的錯題 Google Sheet 網址" />
          </div>
          <div class="field small">
            <label for="targetDate">考試日</label>
            <input id="targetDate" type="date" value="2026-12-06" />
          </div>
          <div class="field">
            <label for="updateEndpoint">Apps Script Web App URL</label>
            <input id="updateEndpoint" type="url" placeholder="貼上部署後的 Web App URL" />
          </div>
          <div class="field">
            <label for="updateToken">更新密碼</label>
            <input id="updateToken" type="password" placeholder="可留空；建議設定" />
          </div>
          <button id="saveSourceBtn" class="primary-button" type="button">儲存並讀取</button>
          <button id="openSheetBtn" class="ghost-button" type="button">開啟表格</button>
          <button id="copyDashboardLinkBtn" class="ghost-button" type="button">複製儀表板連結</button>
        </div>
      </details>

      <section id="setupPanel" class="setup-panel" aria-label="連結說明">
        <div>
          <h2>先連結你的 Google Sheet</h2>
          <p>錯題只維護在 Google Sheet。這個 PWA 會讀取同一張表，更新後按同步即可刷新儀表板。</p>
        </div>
        <ol>
          <li>用 <a href="./google-sheet-template.csv" download>範本欄位</a> 建立或匯入一張 Google Sheet。</li>
          <li>在 Google Sheet 輸入錯題，並把工作表發布到網路。</li>
          <li>把那張 Google Sheet 的網址貼在上方，按同步。</li>
        </ol>
      </section>

      <section class="filter-panel" aria-label="資料篩選">
        <div class="field">
          <label for="sectionFilter">大項</label>
          <select id="sectionFilter">
            <option value="">全部</option>
            <option value="單字語彙">單字語彙</option>
            <option value="文法">文法</option>
            <option value="讀解">讀解</option>
            <option value="聽解">聽解</option>
          </select>
        </div>
        <div class="field">
          <label for="reasonFilter">錯誤原因</label>
          <select id="reasonFilter">
            <option value="">全部</option>
            <option value="單字不熟">單字不熟</option>
            <option value="漢字讀音不熟">漢字讀音不熟</option>
            <option value="文法句型不熟">文法句型不熟</option>
            <option value="接續判斷錯">接續判斷錯</option>
            <option value="語感混淆">語感混淆</option>
            <option value="看太快">看太快</option>
            <option value="定位錯誤">定位錯誤</option>
            <option value="推論過度">推論過度</option>
            <option value="聽不出關鍵字">聽不出關鍵字</option>
            <option value="聽到內容但來不及選">聽到內容但來不及選</option>
            <option value="被干擾選項騙">被干擾選項騙</option>
            <option value="粗心">粗心</option>
          </select>
        </div>
        <button id="clearFiltersBtn" class="ghost-button" type="button">清除</button>
      </section>

      <section id="reasonInsight" class="reason-insight" hidden aria-label="錯誤原因內容">
        <div>
          <span>目前選擇的錯誤原因</span>
          <strong id="reasonTitle">-</strong>
        </div>
        <div class="reason-stats">
          <span id="reasonCount">0 筆</span>
          <span id="reasonSection">大項 -</span>
          <span id="reasonType">題型 -</span>
        </div>
        <div id="reasonExamples" class="reason-examples"></div>
      </section>

      <section class="metrics-grid" aria-label="總覽指標">
        <article class="metric">
          <span>累計錯題</span>
          <strong id="totalErrors">0</strong>
        </article>
        <article class="metric">
          <span>未掌握</span>
          <strong id="openErrors">0</strong>
        </article>
        <article class="metric">
          <span>已掌握</span>
          <strong id="masteredErrors">0</strong>
        </article>
        <article class="metric">
          <span>距離考試</span>
          <strong id="daysLeft">0 天</strong>
        </article>
      </section>

      <section class="detail-panel" aria-label="錯題詳情">
        <div class="panel-heading">
          <h2>字卡預覽</h2>
          <span id="detailMeta">尚未選擇</span>
        </div>
        <div id="errorDetail" class="error-detail"></div>
      </section>

      <section class="dashboard-grid">
        <article class="panel span-6">
          <div class="panel-heading">
            <h2>四大項分布</h2>
            <span id="strongWeakLabel"></span>
          </div>
          <div id="sectionBars" class="bar-chart"></div>
        </article>

        <article class="panel span-6">
          <div class="panel-heading">
            <h2>錯誤原因</h2>
          </div>
          <div id="reasonBars" class="bar-chart compact"></div>
        </article>

        <article class="panel span-6">
          <div class="panel-heading">
            <h2>題型弱項</h2>
          </div>
          <div id="typeBars" class="bar-chart compact"></div>
        </article>

        <article class="panel span-12 flashcard-panel">
          <div class="panel-heading">
            <h2>錯題字卡</h2>
            <span id="cardCount"></span>
          </div>
          <div id="flashcardGrid" class="flashcard-grid"></div>
        </article>
      </section>
    </main>

    <script src="./app.js?v=14" defer></script>
  </body>
</html>
